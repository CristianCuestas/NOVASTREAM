<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Reset.css">
    <title>Restablecimiento de contraseña y/o usuario</title>
</head>
<body>

    <div class="contenedor">

        <div class="informacion">


            <h1>Restablecimiento de contraseña y/o usuario</h1>

            <p>
                Recupera tu usuario y/o contraseña
                de manera rápida y segura.
            </p>

        </div>


        <div class="formulario">
            <div class="candado">🔒</div>

            <h2>Recuperar cuenta</h2>

            <p>
                Ingresa tu correo electrónico
                para recibir las instrucciones.
            </p>

            <form action="Successfull reset.html">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ingresa tu correo"
                    required
                >

                <button type="submit">
                    Recuperar acceso
                </button>

            </form>

        </div>

    </div>

    <div class="ayuda">
    ¿Necesitas ayuda?
    </div>

</body>
</html>
